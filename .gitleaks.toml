# Tamarindos: detección de credenciales con las reglas estándar de Gitleaks.
# La plantilla original trataba marcadores públicos (YOUR_DOMAIN,
# {{SESSION_COOKIE}}), UUID genéricos y constantes numéricas como secretos.
# Estos patrones no identifican credenciales. No se excluyen carpetas de skills
# ni complementos: las reglas estándar analizan también esos archivos.
title = "Tamarindos Secret Scan"

[extend]
useDefault = true

[[rules]]
id = "plane-api-key"
description = "Plane API key"
regex = '''plane_api_[a-f0-9]{32}'''
tags = ["credential"]
